<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Levelyst.AI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .card {
        width: min(680px, 92vw);
        padding: 24px;
        border-radius: 14px;
        border: 1px solid #334155;
        background: rgba(15, 23, 42, 0.85);
      }
      h1 {
        margin: 0 0 10px;
        color: #60a5fa;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.5;
      }
      code {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Levelyst.AI</h1>
      <p>This repo is a Next.js app.</p>
      <p>
        For GitHub Pages, use <strong>GitHub Actions</strong> deployment. This project includes
        <code>.github/workflows/deploy-pages.yml</code> to build and publish automatically.
      </p>
      <p>
        After pushing to <code>main</code>, enable Pages with <strong>Build and deployment: GitHub Actions</strong>.
      </p>
    </div>
  </body>
</html>
